<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>holocard test</title>
	<link rel="stylesheet" href="holo.css" />
</head>

<body>

	<div class="card">
		<div class="glare"></div>
		<img class="base" src="data/image/photography/DSC_0210.jpg" alt="card art" />

		<img class="holo" src="data/image/holo.jpg" alt="the shiny" />

	</div>


	<script>
		const card = document.querySelector('.card');

		card.addEventListener("mouseenter", () => {
			card.style.transition = "none";
		});

		card.addEventListener("mousemove", (event) => {
			const { top, bottom, left, right } = card.getBoundingClientRect();

			const width = right - left;
			const height = bottom - top;
			const middleX = width / 2;
			const middleY = height / 2;

			const clientX = event.clientX - left;
			const clientY = event.clientY - top;

			const offsetX = (clientX - middleX) / middleX;
			const offsetY = (middleY - clientY) / middleY;

			const percentX = (clientX / width) * 100;
			const percentY = (clientY / height) * 100;

			card.style.setProperty('--x', `${percentX}%`);
			card.style.setProperty('--y', `${percentY}%`);
			card.style.transform = `perspective(1000px) rotateY(${offsetX * 15}deg) rotateX(${offsetY * 15}deg) scale3d(1.03, 1.03, 1.03)`;
		});

		card.addEventListener("mouseleave", () => {
			card.style.transition = "transform 1s cubic-bezier(0.22, 1, 0.36, 1), --x 1s cubic-bezier(0.22, 1, 0.36, 1), --y 0.5s cubic-bezier(0.22, 1, 0.36, 1)";
			card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) scale3d(1, 1, 1)`;

			card.style.setProperty('--x', '50%');
			card.style.setProperty('--y', '50%');
		});

	</script>

</body>

</html>
